[project]
name = "agent-panel"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
agent-panel = "agent_panel.cli:main"

[tool.setuptools]
packages = ["agent_panel"]

[tool.setuptools.package-data]
agent_panel = ["assets/*.wav"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
